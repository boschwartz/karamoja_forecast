name: Eastern Kenya Daily IFS Trigger Check

on:
  schedule:
    # Runs daily at 06:42 UTC (07:42 CET in winter / 08:42 CEST in summer)
    - cron: '42 6 * * *'
  workflow_dispatch:
    inputs:
      send_test_item:
        description: "Publish a test RSS item even if neither county triggered?"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  eastern-kenya-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    container:
      image: rocker/geospatial:4.4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install remaining R packages
        run: install2.r --error --skipinstalled httr2 patchwork maps

      - name: Run Mandera & Garissa forecast & generate RSS feed
        env:
          SEND_TEST_ITEM: ${{ inputs.send_test_item }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PAGES_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/eastern_kenya/
        run: Rscript wf_ifs_hres_eastern_kenya.r

      - name: Archive high-res PNG in GitHub Actions
        uses: actions/upload-artifact@v4
        with:
          name: eastern-kenya-dashboard-${{ github.run_number }}
          path: eastern_kenya_ifs_hres_trigger_dashboard.png
          retention-days: 30

      - name: Publish Eastern Kenya site to /eastern_kenya on GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public/eastern_kenya
          destination_dir: eastern_kenya
